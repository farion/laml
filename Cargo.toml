[package]
name = "laml"
version = "1.2.0"
edition = "2024"
description = "Deterministic diagram markup compiler"

[dependencies]
base64 = "=0.22.1"
harfrust = "=0.12.0"
unicode-segmentation = "=1.13.2"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
svg2pdf = "=0.13.0"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
