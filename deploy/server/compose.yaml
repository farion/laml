name: laml-editor
services:
  editor:
    image: laml-editor:1.17.6
    pull_policy: build
    platform: linux/amd64
    build:
      context: .
    ports:
      - "0.0.0.0:7878:7878"
    command:
      - --assets
      - /opt/laml/web
      - --bind
      - 0.0.0.0:7878
      - --max-users
      - "10"
    restart: unless-stopped
