name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v1.2.3" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag does not match Cargo.toml package version" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Test
        shell: bash
        run: cargo +stable test --locked --all-targets
      - name: Build release binary
        shell: bash
        run: cargo +stable build --locked --release
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: target/release/laml check examples/architecture.laml
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\target\release\laml.exe check examples\architecture.laml'
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="laml-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "stage/${name}" dist
          cp target/release/laml README.md LICENSE assets/INTER-LICENSE.txt "stage/${name}/"
          cp -R examples "stage/${name}/examples"
          tar -czf "dist/${name}.tar.gz" -C stage "${name}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "laml-$env:GITHUB_REF_NAME-$env:TARGET"
          $folder = "stage/$name"
          New-Item -ItemType Directory -Path $folder, 'dist' -Force | Out-Null
          Copy-Item target/release/laml.exe, README.md, LICENSE, assets/INTER-LICENSE.txt -Destination $folder
          Copy-Item examples -Destination $folder -Recurse
          Compress-Archive -Path $folder -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify assets and write checksums
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "dist/laml-${GITHUB_REF_NAME}-${target}.tar.gz"
          done
          test -s "dist/laml-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          (cd dist && sha256sum laml-*.tar.gz laml-*.zip > SHA256SUMS)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
