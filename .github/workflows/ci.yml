name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      LAML_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Test
        shell: bash
        run: cargo +stable test --locked --all-targets
      - name: Check code formatting and warnings
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup component add rustfmt clippy --toolchain stable
          cargo +stable fmt --all --check
          cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n scripts/install.sh && python3 tests/install_script.py
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/replace-windows.ps1', 'tests/replace_windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$file is invalid: $parseErrors" }
          }
      - name: Exercise Windows post-exit updater
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\tests\replace_windows.ps1'
